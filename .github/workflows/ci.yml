
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up database schema
        run: |
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -uroot -prootpassword test_db \
            < db/migrations/001_create_tables.sql

          docker exec -i ${{ job.services.mysql.id }} \
            mysql -uroot -prootpassword test_db \
            < db/migrations/002_create_tables.sql

          docker exec -i ${{ job.services.mysql.id }} \
            mysql -uroot -prootpassword test_db \
            < db/migrations/002_add_jobs_first_seen_at.sql

          docker exec -i ${{ job.services.mysql.id }} \
            mysql -uroot -prootpassword test_db \
            < db/migrations/003_add_match_results_recalculation_flag.sql

      - name: Verify database tables
        run: |
          docker exec ${{ job.services.mysql.id }} \
            mysql -uroot -prootpassword test_db \
            -e "SHOW TABLES;"

      - name: Run backend tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: test_db
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
          # Placeholders only so app startup's settings check passes; tests
          # connect with TEST_DB_*. DB_NAME must differ from TEST_DB_NAME.
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: unused_app_db
          DB_USER: unused
          DB_PASSWORD: unused
          APP_ENV: development
          FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend/my-react-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/my-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
